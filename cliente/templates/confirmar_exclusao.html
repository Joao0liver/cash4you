{% extends 'base.html' %}

{% block title %}Excluir Cliente | Cash4You{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card">
        <div class="card-body">

            <h1 class="card-title">Excluir Cliente</h1>

            <p>
                Tem certeza de que deseja excluir o cliente <strong>{{ cliente.nome }}</strong>?
            </p>

            <p class="text-danger">
                Esta ação não poderá ser desfeita.
            </p>

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Sim, excluir
                </button>

                <a href="{% url 'listar_cliente' %}" class="btn btn-secondary">
                    Cancelar
                </a>
            </form>

        </div>
    </div>

</div>

{% endblock %}
