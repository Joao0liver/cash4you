<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Cash4You{% endblock %}</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Layout principal -->
    <div class="d-flex min-vh-100">

        <!-- Sidebar -->
        <aside class="bg-dark text-white p-3" style="width: 240px;">

            <!-- Logo / Nome do sistema -->
            <div class="mb-4">
                <h4 class="mb-0">Cash4You</h4>
                <small class="text-secondary">Painel administrativo</small>
            </div>

            <!-- Navegação -->
            <nav>
                <ul class="nav nav-pills flex-column gap-1">

                    <li class="nav-item">
                        <a href="{% url 'home' %}" class="nav-link text-white">
                            Dashboard
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a href="{% url 'caixa' %}" class="nav-link text-white">
                            Caixa
                        </a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Cadastros
                        </a>

                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="{% url 'listar_cliente' %}">
                                    Clientes
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" href="{% url 'listar_produto' %}">
                                    Produtos
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" href="{% url 'listar_servico' %}">
                                    Serviços
                                </a>
                            </li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a href="{% url 'listar_vendas' %}" class="nav-link text-white">
                            Vendas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="{% url 'listar_agendamento' %}" class="nav-link text-white">
                            Agenda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link text-white">
                            Relatórios
                        </a>
                    </li>

                </ul>
            </nav>

        </aside>

        <!-- Área principal -->
        <div class="flex-grow-1 d-flex flex-column">

            <!-- Navbar superior -->
            <header class="bg-white border-bottom px-4 py-3">
                <div class="d-flex justify-content-end align-items-center gap-2">
                    <!-- Usuário -->
                    <a href="#" class="btn btn-outline-secondary btn-sm">
                        Meu perfil
                    </a>
                    <!-- Logout -->
                    <a href="#" class="btn btn-outline-danger btn-sm">
                        Sair
                    </a>
                </div>
            </header>

            <!-- Conteúdo -->
            <main class="flex-grow-1 p-4">
                {% block content %}
                {% endblock %}
            </main>

            <!-- Footer -->
            <footer class="bg-white border-top text-center py-3">
                <small class="text-muted">
                    Cash4You © 2026 — Em Desenvolvimento por João Augusto e Kleber Ramon
                </small>
            </footer>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
