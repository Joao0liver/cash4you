<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Entrar | Cash4You</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">
    <div class="container min-vh-100 d-flex
                align-items-center justify-content-center">

        <div class="card shadow-sm border-0 p-4"
             style="width: 100%; max-width: 420px;">

            <div class="text-center mb-4">
                <h1 class="h3">Cash4You</h1>
                <p class="text-muted">Entre na sua conta</p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger">
                    E-mail ou senha inválidos.
                </div>
            {% endif %}

            {% if next %}
                {% if user.is_authenticated %}
                    <div class="alert alert-warning">
                        Sua conta não possui autorização
                        para acessar essa página.
                    </div>
                {% endif %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <input type="hidden" name="next"
                       value="{{ next|default:'' }}">

                <div class="mb-3">
                    <label for="id_username"
                           class="form-label">
                        E-mail
                    </label>

                    <input
                        type="email"
                        name="username"
                        id="id_username"
                        class="form-control"
                        autocomplete="email"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-3">
                    <label for="id_password"
                           class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        class="form-control"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit"
                        class="btn btn-primary w-100">
                    Entrar
                </button>
            </form>

        </div>
    </div>
</body>
</html>
